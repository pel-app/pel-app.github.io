<style>
/*
VOICE: prático, de quartel — direto, sem enfeite, cada toque resolve algo.
IDEA: a ficha de rancho / lista de chamada do pelotão, agora viva.
PICTURE: o próprio cardápio com contadores e o valor grande; a lista com selos de pago.
COLOUR and TYPE: azul-farda #1f3a5f, branco, tomate #e2522b como ação; Barlow Condensed nos títulos e números.
LAYOUT: uma coluna de 560px, faixa azul no topo, barra de abas fixa embaixo.
*/
:root{color-scheme:light dark;
--bg:light-dark(#f4f5f7,#0f141b);--card:light-dark(#fff,#18202b);--ink:light-dark(#14181f,#eef1f5);
--mute:light-dark(#5b6472,#9aa5b4);--line:light-dark(#e1e4e9,#2a3442);--farda:#1f3a5f;
--acao:#e2522b;--acao2:light-dark(#c4421e,#ff6a42);--ok:light-dark(#17703f,#4cc283);--okbg:light-dark(#e3f4ea,#13301f);
--av:light-dark(#9a5b00,#f2b54a);--avbg:light-dark(#fff1d9,#3a2a10);--pe:light-dark(#5b6472,#9aa5b4);--pebg:light-dark(#eceef2,#232c38)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.num{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;line-height:1.05;margin:0}
header{position:relative;background:var(--farda);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) max(5vw,16px) 18px}
header .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between}
header h1{font-size:clamp(24px,7vw,32px);letter-spacing:.3px}
header small{display:block;font-size:14px;opacity:.85;font-weight:500}
.net{font-size:13px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.net::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#4cc283;margin-right:6px;vertical-align:1px}
.net.off::before{background:#f2b54a}
main{max-width:560px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:24px;margin-bottom:4px}
.sub{color:var(--mute);font-size:14px}
.aviso{background:var(--avbg);color:var(--av);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .n{flex:1;font-weight:600}
.item .p{color:var(--mute);font-size:14px;white-space:nowrap}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:22px;font-weight:600;cursor:pointer}
.step button.mais{background:var(--farda);border-color:var(--farda);color:#fff}
.step .q{width:28px;text-align:center;font:700 22px "Barlow Condensed",sans-serif}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 4px}
.total .num{font-size:44px;color:var(--acao2);white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--acao);color:#fff;font:700 18px Barlow,sans-serif;cursor:pointer;margin-top:10px;text-decoration:none}
.btn:disabled{opacity:.45}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.azul{background:var(--farda)}
.btn.peq{min-height:44px;font-size:16px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-within{outline:3px solid var(--acao);outline-offset:2px}
label.fl{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,textarea,select{width:100%;font:16px Barlow,sans-serif;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:130px;resize:vertical}
.linha2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.selo{display:inline-block;font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.s-pago{background:var(--okbg);color:var(--ok)}.s-conferir{background:var(--avbg);color:var(--av)}.s-pendente{background:var(--pebg);color:var(--pe)}
.pix{font:13px ui-monospace,monospace;word-break:break-all;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;margin-top:8px;color:var(--mute)}
.motivos{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--av)}
.barra{height:8px;background:var(--pebg);border-radius:99px;overflow:hidden;margin-top:10px}
.barra i{display:block;height:100%;background:var(--farda);width:0;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0 4px}
.stats div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stats .num{font-size:26px;display:block}
.stats span{font-size:12px;color:var(--mute)}
.ped{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.ped .nr{font:700 22px "Barlow Condensed",sans-serif;width:52px;flex:none}
.ped .tx{flex:1;font-size:15px}
.ped .tx small{display:block;color:var(--mute)}
.ped.eu{background:linear-gradient(90deg,transparent,var(--pebg),transparent)}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.acoes button{min-height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px Barlow,sans-serif;cursor:pointer}
.prev{display:grid;grid-template-columns:minmax(0,1fr) 84px 44px;gap:6px;margin-top:6px}
.prev button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;font-size:18px;cursor:pointer}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:186px;background:none;border:0;color:var(--mute);font:600 13px Barlow,sans-serif;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--farda)}
:root[data-theme=dark] nav button.on{color:#8fb4e6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) nav button.on{color:#8fb4e6}}
.menu{width:44px;height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:grid;place-items:center}
.menu svg{width:22px;height:22px}
.drop{position:absolute;right:max(5vw,16px);top:calc(100% - 8px);background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:8;min-width:220px;overflow:hidden}
.drop button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font:600 16px Barlow,sans-serif;padding:14px 16px;cursor:pointer}
.drop button:first-child{border-top:0}
nav button{max-width:240px}
.marca{display:flex;gap:10px;align-items:center}
#logo{width:46px;height:46px;border-radius:12px;object-fit:cover;border:2px solid rgba(255,255,255,.55);flex:none}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--pebg);padding:4px;border-radius:12px;margin-bottom:14px}
.seg button{min-height:42px;border:0;border-radius:9px;background:none;color:var(--mute);font:600 14px Barlow,sans-serif;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.fotoPrev{width:96px;height:96px;border-radius:22px;object-fit:cover;display:block;background:var(--farda)}
.alunos{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;max-height:220px;overflow:auto}
.alunos span{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px}
.grp{margin:16px 0 2px;padding-top:12px;border-top:2px solid var(--farda)}.grp:first-of-type{margin-top:8px}
.grp b{font:700 20px "Barlow Condensed",sans-serif;display:block}.grp span{font-size:14px;color:var(--mute)}
.feito{text-align:center;padding:24px 16px}.feito .ok{width:64px;height:64px;border-radius:50%;background:var(--okbg);color:var(--ok);font:700 36px/64px Barlow,sans-serif;margin:0 auto 10px}
#modal .fundo{position:fixed;inset:0;background:rgba(10,14,20,.62);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:12px 10px calc(10px + env(safe-area-inset-bottom))}
#modal .caixa{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px;padding:16px}
#modal .x{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:24px;cursor:pointer;flex:none}
.bancos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.bancos a{text-decoration:none;min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 16px Barlow,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bancos a.ult{border:2px solid var(--farda);grid-column:1/-1}.bancos small{font-size:12px;color:var(--mute);font-weight:500}
button.link{background:none;border:0;padding:4px 2px;color:var(--acao2);font:600 14px Barlow,sans-serif;cursor:pointer;text-decoration:underline}
img.comp{display:block;width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#14181f;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.25s;z-index:9;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.vazio{text-align:center;padding:30px 10px}
.vazio svg{width:120px;height:90px}
.rodape{text-align:center;font-size:14px;color:var(--mute);margin-top:6px}
.rodape button{background:none;border:0;color:var(--acao2);font:600 14px Barlow,sans-serif;cursor:pointer;padding:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<header><div class="wrap">
  <div class="marca"><img id="logo" hidden alt=""><div><h1><span id="tit">PEL</span></h1><small id="hsub">Pedido de almoço</small></div></div>
  <div style="display:flex;align-items:center;gap:6px"><span class="net" id="net">online</span>
  <button class="menu" data-act="menu" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/></svg></button></div>
</div>
<div class="drop" id="drop" hidden>
  <button data-act="aba" data-v="admin">Área do responsável</button>
  <button data-act="trocar">Trocar meu número</button>
</div></header>
<main id="app"></main>
<nav id="nav">
  <button data-act="aba" data-v="pedir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg>Pedir</button>
  <button data-act="aba" data-v="lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Lista</button>
</nav>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
{
const CONFIG = window.QAJ_CONFIG, PMIN = +CONFIG.PRIMEIRO_PELOTAO || 6, PMAX = +CONFIG.ULTIMO_PELOTAO || 30;
// pelotão = número do aluno sem os 2 últimos dígitos (2116 → 21, 612 → 6, 3005 → 30)
const pelDe = n => { n = String(n || '').replace(/\D/g, ''); if (n.length < 3) return null; const v = parseInt(n.slice(0, -2), 10); return v >= PMIN && v <= PMAX ? String(v) : null; };
let P = null; // pelotão que está aberto na tela
const REMOTO = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY);
const KEY = String(CONFIG.SUPABASE_KEY || ''), URLDB = String(CONFIG.SUPABASE_URL || '').replace(/\/$/, '');

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');
const pad = n => String(n).padStart(2, '0');
const isoDia = (d = new Date()) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const somaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoDia(d); };
const diaBR = iso => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : '';
const SEMANA = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const diaNome = iso => { if (!iso) return ''; const h = isoDia(); if (iso === h) return 'hoje'; if (iso === somaDias(h, 1)) return 'amanhã'; return SEMANA[new Date(iso + 'T12:00:00').getDay()] + ', ' + diaBR(iso); };
const semAcento = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); }
async function copiar(txt) {
  try { await navigator.clipboard.writeText(txt); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove(); return ok;
  }
}
function carregar(src) {
  return new Promise((ok, erro) => {
    if (document.querySelector('script[src="' + src + '"]')) return ok();
    const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => erro(new Error('não carregou ' + src));
    document.head.appendChild(s);
  });
}

const comTempo = (pr, ms) => Promise.race([pr, new Promise((_, er) => setTimeout(() => er(new Error('tempo esgotado')), ms))]);

/* ---------- Pix copia-e-cola (BR Code estático) ---------- */
const campo = (id, v) => id + pad(v.length) + v;
function crc16(s) {
  let c = 0xFFFF;
  for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) : (c << 1); c &= 0xFFFF; }
  return c.toString(16).toUpperCase().padStart(4, '0');
}
const limpa = (s, n) => semAcento(s).toUpperCase().replace(/[^A-Z0-9 ]/g, '').trim().slice(0, n);
const cpfValido = d => {
  if (!/^\d{11}$/.test(d) || /^(\d)\1{10}$/.test(d)) return false;
  const dv = n => { let t = 0; for (let i = 0; i < n; i++) t += +d[i] * (n + 1 - i); const r = (t * 10) % 11; return r === 10 ? 0 : r; };
  return dv(9) === +d[9] && dv(10) === +d[10];
};
// descobre o tipo da chave pelo formato (o tipo escolhido só desempata)
function tipoChave(chave, escolhido) {
  const c = String(chave || '').trim(), d = c.replace(/\D/g, '');
  if (c.includes('@')) return 'email';
  if (/^[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}$/i.test(c)) return 'aleatoria';
  if (c.startsWith('+')) return 'celular';
  if (d.length === 14) return 'cnpj';
  if (d.length === 13 && d.startsWith('55')) return 'celular';
  if (d.length === 11) {
    if (/^\d{3}\.\d{3}\.\d{3}-\d{2}$/.test(c)) return 'cpf';          // 529.982.247-25
    if (/^\(?\d{2}\)?[\s-]/.test(c) || /\d{4,5}-\d{4}$/.test(c)) return 'celular'; // (91) 98888-7777
    if (cpfValido(d)) return 'cpf';      // número que fecha o dígito do CPF quase sempre é CPF
    if (d[2] === '9') return 'celular';
    return escolhido === 'cpf' ? 'cpf' : 'celular';
  }
  if (d.length === 10) return 'celular';
  return escolhido || 'aleatoria';
}
function normChave(tipo, chave) {
  chave = String(chave || '').trim(); tipo = tipoChave(chave, tipo);
  if (tipo === 'cpf' || tipo === 'cnpj') return chave.replace(/\D/g, '');
  if (tipo === 'celular') { const d = chave.replace(/\D/g, ''); return '+' + (d.startsWith('55') && d.length > 11 ? d : '55' + d); }
  if (tipo === 'email') return chave.toLowerCase();
  if (tipo === 'aleatoria') { const h = chave.toLowerCase().replace(/[^0-9a-f]/g, ''); return h.length === 32 ? h.replace(/^(.{8})(.{4})(.{4})(.{4})(.{12})$/, '$1-$2-$3-$4-$5') : chave; }
  return chave;
}
const NOME_TIPO = { celular: 'celular', cpf: 'CPF', cnpj: 'CNPJ', email: 'e-mail', aleatoria: 'chave aleatória' };
const infoChave = (chave, tipo) => String(chave || '').trim() ? 'No Pix vai: ' + normChave(tipo, chave) + ' (' + NOME_TIPO[tipoChave(chave, tipo)] + ')' : '';
// o Pix sempre segue o que está salvo em Ajustes agora (não precisa republicar o cardápio)
// identificador único por pedido: cada pedido gera um Pix diferente, então o banco não acusa "Pix repetido" de um dia para o outro
const txidDe = p => ('P' + p.pelotao + 'N' + p.numero + 'T' + (Date.parse(p.atualizado_em || p.criado_em || '') || Date.now()).toString(36)).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 25);
const pixDe = c => (S.cfg.pix && S.cfg.pix.chave) ? { ...c, ...S.cfg.pix } : c;
function gerarPix(c, valor, txid) {
  c = pixDe(c);
  const conta = campo('00', 'br.gov.bcb.pix') + campo('01', normChave(c.tipo_chave, c.chave));
  let p = campo('00', '01') + campo('26', conta) + campo('52', '0000') + campo('53', '986') +
    (valor > 0 ? campo('54', valor.toFixed(2)) : '') + campo('58', 'BR') +
    campo('59', limpa(c.recebedor, 25) || 'RECEBEDOR') + campo('60', limpa(c.cidade, 15) || 'BELEM') +
    campo('62', campo('05', txid.replace(/[^A-Za-z0-9]/g, '').slice(0, 25) || '***')) + '6304';
  return p + crc16(p);
}

/* ---------- leitura do cardápio colado ---------- */
// Entende os dois formatos:
//  a) "Carne de panela - 15" (preço na linha)
//  b) cabeçalho com preço ("Cardápio valor 10 reais", "Cardápio R$15,00 Acompanha (...)") e os pratos embaixo
const limpaLinha = l => String(l).replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}\u{20E3}]/gu, ' ').replace(/[*_~•·]/g, ' ').replace(/\s+/g, ' ').trim();
const arrumaNome = n => { n = n.replace(/^[\s\-–—>)\d.º°]+/, '').replace(/[\s\-–—:;,.=]+$/, '').replace(/\s*\/\s*/g, '/').trim(); return n ? n[0].toUpperCase() + n.slice(1) : ''; };
const numBR = t => parseFloat(String(t).replace(',', '.'));
function lerCardapio(txt) {
  const itens = []; let preco = null, grupo = '', fornecedor = '', data = null;
  for (const bruta of String(txt).split(/\n/)) {
    const l = limpaLinha(bruta); if (!l || /^pix\b|chave/i.test(l)) continue;
    const cab = /card[aá]pio|valor|acompanha|marmitas? de|pre[cç]o/i.test(l);

async function extrairTexto(file, prog = () => {}) {
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
    const pdfjs = await pdfLib();
    const doc = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    let t = '';
    for (let i = 1; i <= doc.numPages; i++) {
      // junta os pedaços de texto por linha (mesma altura na página), da esquerda para a direita
      const its = (await (await doc.getPage(i)).getTextContent()).items.filter(x => x.str.trim());
      const linhas = [];
      for (const x of its) {
        const y = x.transform[5], l = linhas.find(z => Math.abs(z.y - y) < 3);
        (l ? l.its : (linhas.push({ y, its: [] }), linhas[linhas.length - 1].its)).push(x);
      }
      linhas.sort((m, n) => n.y - m.y);
      t += linhas.map(l => l.its.sort((m, n) => m.transform[4] - n.transform[4]).map(x => x.str.trim()).join(' ')).join('\n') + '\n';
      prog(i / doc.numPages);
    }
    if (t.replace(/\s/g, '').length > 40) return t;
    // PDF escaneado (só imagem): lê com OCR página por página
    let o = '';
    for (let i = 1; i <= Math.min(doc.numPages, 5); i++) {
      const pg = await doc.getPage(i), vp = pg.getViewport({ scale: 2 }), cv = document.createElement('canvas');
      cv.width = vp.width; cv.height = vp.height;
      await pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      o += await ocr(cv) + '\n';
    }
    return o;
  }
  if (/^text\//.test(file.type) || /\.(txt|csv)$/i.test(file.name)) return file.text();
  return ocr(file);
}

async function prepImagem(img) {

// Lê o print por FAIXAS, começando pelo meio/baixo (onde costuma ficar "Origem/Pagador"),
// e PARA assim que acha o nome do aluno. Não precisa ler o comprovante inteiro.
async function ocrFoco(file, nome) {

  const w = await comTempo(prepararOCR(), 60000);
  const cv = await prepImagem(file), W = cv.width, H = cv.height;

    txt += (await w.recognize(cv, { rectangle: { left: 0, top, width: W, height: alt } })).data.text + '\n';
    if (nome && temNome(semAcento(txt).toLowerCase(), nome)) break;
  }

}
async function ocr(img) {
  if (ocrIndisp) throw new Error('leitor de imagem indisponível');
  const w = await comTempo(prepararOCR(), 60000);
  return (await w.recognize(await prepImagem(img))).data.text;

const MESES = { jan:1, fev:2, mar:3, abr:4, mai:5, jun:6, jul:7, ago:8, set:9, out:10, nov:11, dez:12 };
const distancia = (a, b) => { // quantas letras diferentes (Levenshtein)
  const m = a.length, n = b.length; if (Math.abs(m - n) > 2) return 9;
  let ant = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const at = [i]; for (let j = 1; j <= n; j++) at[j] = Math.min(ant[j] + 1, at[j - 1] + 1, ant[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); ant = at; }
  return ant[n];
};
function temNome(textoBaixo, nome) {
  const nos = [...new Set(semAcento(nome).toLowerCase().split(/[^a-z]+/).filter(w => w.length > 2 && !['dos', 'das', 'des', 'del'].includes(w)))];
  if (!nos.length) return false;
  const pal = new Set(textoBaixo.split(/[^a-z]+/).filter(w => w.length > 2));
  const acha = w => pal.has(w) || [...pal].some(x => distancia(w, x) <= (w.length >= 6 ? 2 : 1));
  return nos.filter(acha).length >= Math.min(2, nos.length);
}
function analisar(texto, ped, c) {
  const motivos = [], T = semAcento(texto), low = T.toLowerCase();
  // valor
  const vals = [...T.matchAll(/(?:R\s?\$|valor)\s*:?\s*(?:R\s?\$)?\s*(\d{1,3}(?:\.\d{3})*,\d{2})/gi)]
    .map(m => +m[1].replace(/\./g, '').replace(',', '.'));
  const valorOk = vals.some(v => Math.abs(v - ped.total) < 0.005);
  if (vals.length && !valorOk) motivos.push('Valor ' + brl(vals[0]) + ' diferente do pedido (' + brl(ped.total) + ')');
  // ID da transação (E2E): E + ISPB(8) + AAAAMMDDHHMM(12) + 11 caracteres
  const flat = T.toUpperCase().replace(/[^A-Z0-9]/g, '');
  let e2e = null, dataE2E = null;
  for (const m of flat.matchAll(/E[0-9OIL]{20}[A-Z0-9]{11}/g)) {
    const dig = m[0].slice(1, 21).replace(/O/g, '0').replace(/[IL]/g, '1');
    const a = dig.slice(8, 12), me = +dig.slice(12, 14), d = +dig.slice(14, 16);
    if (a >= '2020' && a <= '2099' && me >= 1 && me <= 12 && d >= 1 && d <= 31) {
      e2e = 'E' + dig + m[0].slice(21); dataE2E = a + '-' + dig.slice(12, 14) + '-' + dig.slice(14, 16); break;
    }
  }
  // data
  const datas = [];
  if (dataE2E) datas.push(dataE2E);
  for (const m of T.matchAll(/(\d{2})\/(\d{2})\/(\d{4})/g)) datas.push(m[3] + '-' + m[2] + '-' + m[1]);
  for (const m of low.matchAll(/(\d{1,2})\s*(?:de\s*)?(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*\.?\s*(?:de\s*)?(\d{4})/g))
    datas.push(m[3] + '-' + pad(MESES[m[2]]) + '-' + pad(m[1]));
  const hoje = isoDia(), inicio = c && c.criado_em ? isoDia(new Date(c.criado_em)) : somaDias(hoje, -1);
  const dataOk = datas.some(d => d >= somaDias(inicio, -1) && d <= somaDias(hoje, 1));
  const nomeOk = temNome(low, ped.nome);
  // Aprova se:  A) o NOME do aluno aparece (e o valor, se lido, bate)
  //         ou  B) VALOR certo + DATA do período + ID do Pix (código E…) que nunca foi usado em outro pedido
  const viaNome = nomeOk && (!vals.length || valorOk), viaPix = valorOk && !!e2e && dataOk;
  const ok = !motivos.some(m => m.startsWith('Valor')) && (viaNome || viaPix);
  if (!ok) {
    if (!nomeOk) motivos.push('Nome do aluno não encontrado');
    if (!vals.length) motivos.push('Valor não encontrado');
    if (!e2e) motivos.push('ID do Pix (código E…) não encontrado');
    if (!dataOk) motivos.push(datas.length ? 'Data fora do período do pedido' : 'Data não encontrada');
  }
  return { ok, nomeOk, via: viaNome ? 'nome' : viaPix ? 'pix' : '', e2e, valor: valorOk ? ped.total : (vals[0] ?? null), data: datas[0] || null, motivos: ok ? [] : [...new Set(motivos)] };
}

async function enviar(p) {

    await API.alunoSalvar(S.eu, { ...p, e2e: null, status: 'conferir', comprovante: { ...(p.comprovante || {}), motivos } }); return 'dup';

async function miniatura(file) {
  let src;
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
    const doc = await (await pdfLib()).getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const pg = await doc.getPage(1), v0 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: Math.min(2, 700 / v0.width) });
    src = document.createElement('canvas'); src.width = vp.width; src.height = vp.height;
    const cx = src.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, src.width, src.height);
    await pg.render({ canvasContext: cx, viewport: vp }).promise;
  } else {
    const url = URL.createObjectURL(file); src = new Image();
    await new Promise((ok, er) => { src.onload = ok; src.onerror = er; src.src = url; });
  }
  const w = src.naturalWidth || src.width, h = src.naturalHeight || src.height, k = Math.min(1, 700 / w, 1600 / h);
  const cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
  const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(src, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', 0.6);
}

}

// ferramenta de diagnóstico: mostra cada etapa da leitura e o tempo de cada uma
async function diagLeitura(file) {
  const t0 = performance.now(), linhas = [];
  const log = m => { linhas.push(((performance.now() - t0) / 1000).toFixed(1) + ' s · ' + m); S.diag = linhas.join('\n'); const o = $('#diagOut'); if (o) o.textContent = S.diag; };
  const nome = ($('#diagNome') || {}).value || '', valor = parseFloat((($('#diagValor') || {}).value || '').replace(',', '.')) || 0;
  try {
    log('Arquivo: ' + file.name + ' · ' + Math.round(file.size / 1024) + ' KB · ' + (file.type || 'tipo desconhecido') + ' · internet: ' + (navigator.onLine ? 'sim' : 'não'));
    let texto;
    if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) { log('É PDF: lendo o texto do PDF…'); texto = await extrairTexto(file); log('PDF lido.'); }
    else {
      if (ocrIndisp) { log('O leitor tinha falhado antes (' + (ocrErro || 'sem detalhe') + '). Tentando de novo…'); ocrIndisp = false; ocrW = null; }
      log('Carregando o leitor de imagem (1ª vez baixa alguns MB)…');
      const w = await comTempo(prepararOCR() || Promise.reject(new Error(ocrErro || 'leitor indisponível')), 90000);
      log('Leitor pronto.');
      const cv = await prepImagem(file); log('Imagem preparada: ' + cv.width + ' × ' + cv.height + ' px. Lendo a imagem inteira…');
      texto = (await w.recognize(cv)).data.text; log('Leitura terminada.');
    }
    log('—— TEXTO LIDO ——\n' + (String(texto).trim().slice(0, 1500) || '(nada)'));
    const r = analisar(texto, { nome, total: valor }, pixDe(S.cardapio || {}));
    log('—— RESULTADO ——\nNome "' + (nome || '—') + '": ' + (nome ? (r.nomeOk ? 'ENCONTRADO' : 'não encontrado') : 'não informado') +
      '\nValor lido: ' + (r.valor != null ? brl(r.valor) : 'não encontrado') + '\nData lida: ' + (r.data ? diaBR(r.data) : 'não encontrada') +
      '\nID do Pix: ' + (r.e2e || 'não encontrado') + '\nAprovaria: ' + (r.ok ? 'SIM (via ' + r.via + ')' : 'NÃO'));
  } catch (e) { log('ERRO: ' + String(e && e.message || e) + (ocrErro ? ' | leitor: ' + ocrErro : '')); }
}
async function aoEscolher(t) {
  S.escolhendo = 0; const f = t.files && t.files[0]; if (!f) return;
  if (t.id === 'comp') { lerComprovante(f); t.value = ''; }
  else if (t.id === 'diagArq') { t.value = ''; diagLeitura(f); }
  else if (t.id === 'foto' && f) { try { S.aj.foto = await processaFoto(f); render(); toast('Foto escolhida. Toque em Salvar ajustes'); } catch (e) { toast('Não consegui abrir essa imagem'); } t.value = ''; }
  else if ((t.id === 'alArq' || t.id === 'cdArq') && f) {
    const alvo = t.id === 'alArq' ? 'alunos' : 'cardapio'; t.value = '';
    S.arq = { alvo, lendo: true, msg: 'Lendo ' + f.name + '…' }; render();
    try {
      const txt = (await extrairTexto(f, p => { const b = $('#barraArq'); if (b) b.style.width = Math.round(p * 100) + '%'; })).trim();
      if (!txt) S.arq = { alvo, msg: 'Não encontrei texto nesse arquivo. Tente outro PDF ou uma foto nítida.' };
      else if (alvo === 'alunos') {
        const l = lerAlunos(txt);
        if (l.length) { S.aj.alunosTxt = l.map(x => x.numero + (x.nome ? ' - ' + x.nome : '')).join('\n'); S.arq = { alvo, ok: true, msg: l.length + ' alunos encontrados. Confira e toque em Salvar lista do pelotão.' }; }
        else { S.aj.alunosTxt = txt; S.arq = { alvo, msg: 'Li o arquivo, mas não achei números de aluno (ex.: 2101). O texto lido está na caixa acima para você ajustar.' }; }
      } else {
        S.form.texto = txt; S.form.previa = lerCardapio(txt); aplicaInfo();
        S.arq = S.form.previa.length ? { alvo, ok: true, msg: S.form.previa.length + ' itens encontrados. Confira os preços.' } : { alvo, msg: 'Li o arquivo, mas não achei pratos com preço. O texto lido está na caixa acima.' };
      }
    } catch (e) { S.arq = { alvo, msg: 'Não consegui ler o arquivo: ' + String(e && e.message || e).slice(0, 120) }; }
    render();
  }
}
